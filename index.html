  :root{
    --green:#1f7a3d; --green-dark:#14572b; --leaf:#e8f5ec; --cream:#fbfaf3;
    --ink:#1d2a21; --muted:#5d6b62; --line:#d6e4da; --accent:#f2a900; --red:#b3261e;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"NotoKn",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--cream);color:var(--ink);line-height:1.5}
  header{background:linear-gradient(160deg,var(--green-dark),var(--green));color:#fff;padding:34px 18px 60px;text-align:center;position:relative}
  header h1{margin:0;font-size:2.1rem;letter-spacing:.3px;line-height:1.2}
  header .illus svg{display:block;width:min(300px,78%);height:auto;margin:8px auto 0}
  header p{margin:10px auto 0;max-width:480px;opacity:.92}
  .badge{display:inline-block;background:var(--accent);color:#3a2a00;font-weight:700;border-radius:999px;padding:4px 12px;font-size:.8rem;margin-bottom:10px}
  .langtoggle{position:absolute;top:12px;right:12px;display:flex;background:rgba(255,255,255,.18);border-radius:999px;padding:3px}
  .langtoggle button{border:none;background:transparent;color:#fff;font:inherit;font-weight:700;font-size:.85rem;padding:6px 12px;border-radius:999px;cursor:pointer}
  .langtoggle button.active{background:#fff;color:var(--green-dark)}
  main{max-width:560px;margin:-36px auto 40px;padding:0 14px;position:relative;z-index:1}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 4px 14px rgba(20,87,43,.07)}
  .notice{border-color:#f0d58a;background:#fff9e6}
  .notice div{display:flex;gap:10px;align-items:flex-start;font-weight:600;font-size:.95rem}
  .notice div+div{margin-top:8px}
  h2{margin:0 0 4px;font-size:1.1rem;color:var(--green-dark)}
  .hint{margin:0 0 12px;color:var(--muted);font-size:.9rem}
  label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
  input,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:#fff}
  input:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(31,122,61,.15)}
  .item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
  .item:last-of-type{border-bottom:none}
  .item .nm{font-weight:600}
  .item .sub{display:block;font-size:.85rem;color:var(--muted);font-weight:400}
  .item .price{display:block;font-size:.95rem;color:var(--green-dark);font-weight:800}
  .item .na{display:block;font-size:.85rem;color:var(--red);font-weight:700}
  .item.off{opacity:.55}
  .stepper{display:flex;align-items:center;gap:8px}
  .stepper button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--green);background:#fff;color:var(--green);font-size:1.3rem;line-height:1;cursor:pointer}
  .stepper button:active{background:var(--leaf)}
  .stepper button:disabled{border-color:var(--line);color:var(--line);cursor:not-allowed}
  .stepper output{min-width:26px;text-align:center;font-weight:700;font-size:1.05rem}
  .item.on{background:var(--leaf);margin:0 -8px;padding:10px 8px;border-radius:10px}
  .other{display:flex;gap:8px;margin-top:10px}
  .other input:first-child{flex:2}.other input:last-child{flex:1}
  .total{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:12px;border-radius:10px;background:var(--green-dark);color:#fff;font-weight:800;font-size:1.1rem}
  .check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-weight:600;font-size:.92rem;cursor:pointer}
  .check input{width:20px;height:20px;margin:2px 0 0;flex:none;accent-color:var(--green)}
  .locbtn{width:100%;margin-top:12px;border:1.5px solid var(--green);background:#fff;color:var(--green-dark);font:inherit;font-weight:700;font-size:1rem;padding:12px;border-radius:10px;cursor:pointer}
  .locbtn:disabled{opacity:.6;cursor:wait}
  .locnote{margin-top:6px;font-size:.85rem;color:var(--muted)}
  .locnote.bad{color:var(--red)}
  .locnote.good{color:var(--green-dark);font-weight:700}
  .summary{background:var(--leaf);border-radius:10px;padding:10px 12px;font-size:.92rem;margin-top:12px;display:none;white-space:pre-line}
  .send{width:100%;border:none;border-radius:14px;padding:16px;font-size:1.1rem;font-weight:700;color:#fff;background:#25D366;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
  .send:active{background:#1da851}
  .sent{display:none;margin-top:14px;padding:14px;border-radius:12px;background:var(--leaf);border:1.5px solid var(--green);color:var(--green-dark);font-weight:700;text-align:center}
  .err{color:var(--red);font-size:.9rem;margin-top:8px;min-height:1.2em}
  .alt{text-align:center;color:var(--muted);font-size:.92rem}
  .alt a{color:var(--green-dark);font-weight:700}
  footer{text-align:center;color:var(--muted);font-size:.85rem;padding:0 14px 30px}

  /* language chooser (first screen) */
  #chooser{position:fixed;inset:0;z-index:10;background:linear-gradient(160deg,var(--green-dark),var(--green));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  #chooser.hidden{display:none}
  #chooser .logo{font-size:3.2rem}
  #chooser h1{margin:6px 0 0;font-size:2.2rem;line-height:1.2}
  #chooser .illus svg{display:block;width:min(300px,80%);height:auto;margin:0 auto 6px}
  #chooser p{margin:0 0 26px;opacity:.92}
  #chooser .opts{display:flex;flex-direction:column;gap:14px;width:100%;max-width:320px}
  #chooser .opts button{border:none;border-radius:16px;padding:18px;font:inherit;font-size:1.4rem;font-weight:800;color:var(--green-dark);background:#fff;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.18)}
  #chooser .opts button:active{transform:scale(.98)}
  #chooser .kn{font-size:1.15em}
  #chooser .opts button[data-lang="kn"]{font-size:1.6rem}
</style>

      h_items: "1. ನಿಮ್ಮ ಸೊಪ್ಪು ಆಯ್ಕೆ ಮಾಡಿ", hint_items: "ಕಟ್ಟು ಸೇರಿಸಲು + ಒತ್ತಿ. ಬೆಲೆ ಒಂದು ಕಟ್ಟಿಗೆ.",
      unit: "ಕಟ್ಟು", na: "ಸ್ಟಾಕ್ ಇಲ್ಲ", left_a: "ಕೇವಲ ", left_b: " ಕಟ್ಟು ಉಳಿದಿದೆ", total: "ಒಟ್ಟು",
      other_name: "ಬೇರೆ ಸೊಪ್ಪು (ಬೇಕಿದ್ದರೆ)", other_qty: "ಪ್ರಮಾಣ",
      h_date: "2. ಯಾವ ದಿನ ಬೇಕು?", l_date: "ಡೆಲಿವರಿ ದಿನಾಂಕ",
      date_hint: "ನಾಳೆಯಿಂದ ಮಾತ್ರ ಆಯ್ಕೆ ಮಾಡಬಹುದು (ಒಂದು ದಿನ ಮುಂಚೆ ಆರ್ಡರ್ ಮಾಡಿ).",
      h_details: "3. ನಿಮ್ಮ ವಿವರಗಳು", l_name: "ಹೆಸರು", p_name: "ನಿಮ್ಮ ಹೆಸರು",
      l_phone: "ಮೊಬೈಲ್ ಸಂಖ್ಯೆ", p_phone: "10 ಅಂಕಿಯ ಸಂಖ್ಯೆ",
      l_addr: "ಡೆಲಿವರಿ ವಿಳಾಸ / ಏರಿಯಾ", p_addr: "ಮನೆ ಸಂಖ್ಯೆ, ರಸ್ತೆ, ಏರಿಯಾ",
      l_area: "ನನ್ನ ವಿಳಾಸ ಚಿಕ್ಕಬೆಟ್ಟಹಳ್ಳಿ ಸುತ್ತಮುತ್ತ ಇದೆ (ಈ ಪ್ರದೇಶದಲ್ಲಿ ಮಾತ್ರ ಡೆಲಿವರಿ).",
      l_note: "ಏನಾದರೂ ಸೂಚನೆ (ಬೇಕಿದ್ದರೆ)", p_note: "ಉದಾ: ಬೆಳಿಗ್ಗೆ ಡೆಲಿವರಿ, ಬರೀ ಹಸಿರು ಎಲೆಗಳು",
      loc_btn: "📍 ನನ್ನ ಈಗಿನ ಲೊಕೇಶನ್ ಕಳುಹಿಸಿ", loc_busy: "ಲೊಕೇಶನ್ ಪಡೆಯಲಾಗುತ್ತಿದೆ…", loc_remove: "✕ ಲೊಕೇಶನ್ ತೆಗೆಯಿರಿ",
      loc_hint: "ಐಚ್ಛಿಕ. ನಿಮ್ಮ ಮನೆ ಸುಲಭವಾಗಿ ಹುಡುಕಲು ಸಹಾಯ.", loc_ok: "ಲೊಕೇಶನ್ ಸೇರಿಸಲಾಗಿದೆ ✓ ಇದು ನಿಮ್ಮ ಆರ್ಡರ್‌ನೊಂದಿಗೆ ಬರುತ್ತದೆ.",
      loc_fail: "ನಿಮ್ಮ ಲೊಕೇಶನ್ ಪಡೆಯಲಾಗಲಿಲ್ಲ. ಬ್ರೌಸರ್‌ನಲ್ಲಿ ಲೊಕೇಶನ್ ಅನುಮತಿ ನೀಡಿ, ಅಥವಾ ವಿಳಾಸ ಟೈಪ್ ಮಾಡಿ.",
      loc_nosupport: "ನಿಮ್ಮ ಬ್ರೌಸರ್ ಲೊಕೇಶನ್ ಹಂಚಲು ಸಾಧ್ಯವಿಲ್ಲ. ದಯವಿಟ್ಟು ವಿಳಾಸ ಟೈಪ್ ಮಾಡಿ.", m_loc: "ಲೊಕೇಶನ್",
      send: "ವಾಟ್ಸಾಪ್‌ನಲ್ಲಿ ಆರ್ಡರ್ ಕಳುಹಿಸಿ", call: "ಮಾತನಾಡಬೇಕೇ? ಕರೆ ಮಾಡಿ ಅಥವಾ ವಾಟ್ಸಾಪ್ ಮಾಡಿ",
      footer: "ಸೊಪ್ಪು ಮನೆ. ಚಿಕ್ಕಬೆಟ್ಟಹಳ್ಳಿ ಸುತ್ತಮುತ್ತ ತಾಜಾ ಸೊಪ್ಪು.",
      e_item: "ದಯವಿಟ್ಟು ಕನಿಷ್ಠ ಒಂದು ಸೊಪ್ಪು ಸೇರಿಸಿ.", e_date: "ದಯವಿಟ್ಟು ಡೆಲಿವರಿ ದಿನಾಂಕ ಆಯ್ಕೆ ಮಾಡಿ (ನಾಳೆ ಅಥವಾ ನಂತರ).",
      e_fill: "ದಯವಿಟ್ಟು ಹೆಸರು, ಮೊಬೈಲ್ ಸಂಖ್ಯೆ ಮತ್ತು ವಿಳಾಸ ತುಂಬಿ.", e_phone: "ದಯವಿಟ್ಟು ಸರಿಯಾದ 10 ಅಂಕಿಯ ಮೊಬೈಲ್ ಸಂಖ್ಯೆ ನೀಡಿ.",
      e_area: "ಕ್ಷಮಿಸಿ, ನಾವು ಚಿಕ್ಕಬೆಟ್ಟಹಳ್ಳಿ ಸುತ್ತಮುತ್ತ ಮಾತ್ರ ಡೆಲಿವರಿ ಮಾಡುತ್ತೇವೆ. ನಿಮ್ಮ ವಿಳಾಸ ಈ ಪ್ರದೇಶದಲ್ಲಿದ್ದರೆ ಬಾಕ್ಸ್ ಟಿಕ್ ಮಾಡಿ.",
      m_hello: "ನಮಸ್ಕಾರ ಸೊಪ್ಪು ಮನೆ, ನನಗೆ ಈ ಸೊಪ್ಪು ಬೇಕು:", m_bunch: "ಕಟ್ಟು", m_bunches: "ಕಟ್ಟು",
      m_total: "ಒಟ್ಟು", m_other: "(+ ಬೇರೆ ಸೊಪ್ಪು, ಬೆಲೆ ನಂತರ ತಿಳಿಸುತ್ತೇನೆ)",
      m_date: "ಡೆಲಿವರಿ ದಿನಾಂಕ", m_name: "ಹೆಸರು", m_phone: "ಮೊಬೈಲ್", m_addr: "ವಿಳಾಸ", m_note: "ಸೂಚನೆ", locale: "kn-IN",
      m_orderno: "ಆರ್ಡರ್ ಸಂಖ್ಯೆ", m_items: "ಆರ್ಡರ್ ವಿವರ", m_thanks: "ಧನ್ಯವಾದಗಳು! ದಯವಿಟ್ಟು ನನ್ನ ಆರ್ಡರ್ ದೃಢೀಕರಿಸಿ.",
      sent: "✅ ನಿಮ್ಮ ಆರ್ಡರ್ ವಾಟ್ಸಾಪ್‌ನಲ್ಲಿ ಸಿದ್ಧವಾಗಿದೆ. ಅಲ್ಲಿ ಕಳುಹಿಸಿ ಬಟನ್ ಒತ್ತಿ. ನಿಮ್ಮ ಆರ್ಡರ್ ಅನ್ನು ವಾಟ್ಸಾಪ್‌ನಲ್ಲಿ ಶೀಘ್ರದಲ್ಲೇ ದೃಢೀಕರಿಸುತ್ತೇವೆ. 🌿"
    }
  };
  // ========================

  var lang = "en";
  var items = DEFAULT_ITEMS.slice();
  var qty = {};                       // keyed by English name so it survives a price reload
  var itemsBox = document.getElementById("items");
  var dateEl = document.getElementById("date");
  var rows = [];

  function money(n){ return "₹" + (Math.round(n * 100) / 100); }
  // sold out = marked not available, or stock set to 0. stock empty/null = no limit.
  function hasStock(it){ return it.stock !== null && it.stock !== undefined && it.stock !== ""; }
  function soldOut(it){ return it.available === false || (hasStock(it) && Number(it.stock) <= 0); }
  function maxQty(it){ return hasStock(it) ? Math.max(0, Math.min(50, Math.floor(Number(it.stock)))) : 50; }

  function calcTotal(){
    var sum = 0;
    items.forEach(function(it){ if (!soldOut(it)) sum += (qty[it.en] || 0) * Number(it.price || 0); });
    document.getElementById("totalVal").textContent = money(sum);
    return sum;
  }

  function renderItems(){
    itemsBox.innerHTML = "";
    rows = [];
    items.forEach(function(it){
      var avail = !soldOut(it);
      if (!avail) qty[it.en] = 0;
      if ((qty[it.en] || 0) > maxQty(it)) qty[it.en] = maxQty(it);
      if (!qty[it.en]) qty[it.en] = 0;
      var row = document.createElement("div");
      row.className = "item" + (avail ? "" : " off");
      row.innerHTML = '<div class="nm"><span class="main"></span><span class="sub"></span><span class="price"></span></div>' +
        '<div class="stepper"><button type="button" aria-label="−">−</button><output>0</output><button type="button" aria-label="+">+</button></div>';
      var out = row.querySelector("output");
      var b = row.querySelectorAll("button");
      function set(n){
        qty[it.en] = Math.max(0, Math.min(maxQty(it), n));
        out.textContent = qty[it.en];
        row.classList.toggle("on", qty[it.en] > 0);
        calcTotal();
      }
      b[0].disabled = b[1].disabled = !avail;
      b[0].onclick = function(){ set(qty[it.en] - 1); };
      b[1].onclick = function(){ set(qty[it.en] + 1); };
      out.textContent = qty[it.en];
      row.classList.toggle("on", qty[it.en] > 0);
      itemsBox.appendChild(row);
      rows.push(row);
    });
    fillRowText();
    calcTotal();
  }

  function fillRowText(){
    var t = T[lang];
    rows.forEach(function(row, i){
      var it = items[i];
      var avail = !soldOut(it);
      row.querySelector(".main").textContent = lang === "kn" ? it.kn : it.en;
      row.querySelector(".sub").textContent = lang === "kn" ? it.en : it.kn;
      var p = row.querySelector(".price, .na");
      p.className = avail ? "price" : "na";
      p.textContent = avail ? (money(it.price) + " / " + t.unit + (hasStock(it) ? "  ·  " + t.left_a + maxQty(it) + t.left_b : "")) : t.na;
    });
  }

  function applyLang(l){
    lang = l;
    var t = T[l];
    document.documentElement.lang = l;
    try { localStorage.setItem("soppu_lang", l); } catch(e){}
    document.querySelectorAll("[data-t]").forEach(function(el){ el.textContent = t[el.getAttribute("data-t")]; });
    document.querySelectorAll("[data-p]").forEach(function(el){ el.placeholder = t[el.getAttribute("data-p")]; });
    fillRowText();
    document.querySelectorAll("#toggle button").forEach(function(b){ b.classList.toggle("active", b.getAttribute("data-lang") === l); });
    document.title = (l === "kn" ? "ಸೊಪ್ಪು ಮನೆ" : "Soppu Mane");
    document.getElementById("err").textContent = "";
    renderLoc();
  }

  // current location (optional): one-time GPS pin sent as a Google Maps link
  var loc = null, locState = "idle";
  function renderLoc(){
    var t = T[lang], btn = document.getElementById("locBtn"), note = document.getElementById("locNote");
    btn.disabled = (locState === "busy");
    btn.textContent = locState === "ok" ? t.loc_remove : (locState === "busy" ? t.loc_busy : t.loc_btn);
    note.className = "locnote" + (locState === "ok" ? " good" : (locState === "fail" || locState === "nosupport" ? " bad" : ""));
    note.textContent = locState === "ok" ? t.loc_ok : locState === "fail" ? t.loc_fail : locState === "nosupport" ? t.loc_nosupport : t.loc_hint;
  }
  document.getElementById("locBtn").onclick = function(){
    if (locState === "ok") { loc = null; locState = "idle"; renderLoc(); return; }
    if (!navigator.geolocation) { locState = "nosupport"; renderLoc(); return; }
    locState = "busy"; renderLoc();
    navigator.geolocation.getCurrentPosition(function(pos){
      loc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      locState = "ok"; renderLoc();
    }, function(){
      loc = null; locState = "fail"; renderLoc();
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  };

  // language chooser + header toggle
  var chooser = document.getElementById("chooser");
  chooser.querySelectorAll("button").forEach(function(b){
    b.onclick = function(){ applyLang(b.getAttribute("data-lang")); chooser.classList.add("hidden"); window.scrollTo(0, 0); };
  });
  document.querySelectorAll("#toggle button").forEach(function(b){
    b.onclick = function(){ applyLang(b.getAttribute("data-lang")); };
  });

  renderItems();
  var saved = null;
  try { saved = localStorage.getItem("soppu_lang"); } catch(e){}
  if (saved === "en" || saved === "kn") { applyLang(saved); chooser.classList.add("hidden"); }
  else { applyLang("en"); }

  // load latest prices (set by the owner in admin.html -> prices.json)
  try {
    fetch("prices.json?v=" + Date.now(), { cache: "no-store" })
      .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(data){
        if (data && Array.isArray(data.items) && data.items.length) {
          items = data.items.filter(function(x){ return x && x.en; });
          renderItems();
        }
      })
      .catch(function(){ /* keep default prices */ });
  } catch(e){}

  // date: earliest is tomorrow (order one day before), local time
  var d = new Date();
  var pad = function(n){ return String(n).padStart(2, "0"); };
  var iso = function(x){ return x.getFullYear() + "-" + pad(x.getMonth() + 1) + "-" + pad(x.getDate()); };
  var tomorrow = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
  dateEl.min = iso(tomorrow);
  dateEl.value = iso(tomorrow);

  function prettyDate(s){
    var p = s.split("-");
    var dt = new Date(+p[0], +p[1] - 1, +p[2]);
    try { return dt.toLocaleDateString(T[lang].locale, {weekday:"long", day:"numeric", month:"long", year:"numeric"}); }
    catch(e){ return s; }
  }

  // remember customer details for next time
  ["name", "phone", "addr"].forEach(function(id){
    try { var v = localStorage.getItem("soppu_" + id); if (v) document.getElementById(id).value = v; } catch(e){}
  });

  document.getElementById("f").addEventListener("submit", function(e){
    e.preventDefault();
    var t = T[lang];
    var err = document.getElementById("err");
    err.textContent = "";
    var lines = [];
    var sum = 0;
    function numEmoji(i){ return i <= 9 ? (i + "\uFE0F\u20E3") : "▪️"; }
    items.forEach(function(it){
      var n = qty[it.en] || 0;
      if (n > 0 && !soldOut(it)) {
        var price = Number(it.price || 0);
        sum += n * price;
        var unit = lang === "kn" ? t.m_bunch : (n > 1 ? t.m_bunches : t.m_bunch);
        // name in both languages so the order is clear either way
        lines.push(numEmoji(lines.length + 1) + " *" + it.kn + " / " + it.en + "*\n      " + n + " " + unit + " × " + money(price) + " = *" + money(n * price) + "*");
      }
    });
    var on = document.getElementById("otherName").value.trim();
    var oq = document.getElementById("otherQty").value.trim();
    if (on) lines.push(numEmoji(lines.length + 1) + " *" + on + "*" + (oq ? "\n      " + oq : ""));

    var name = document.getElementById("name").value.trim();
    var phone = document.getElementById("phone").value.trim();
    var addr = document.getElementById("addr").value.trim();
    var date = dateEl.value;
    var note = document.getElementById("note").value.trim();

    if (!lines.length) { err.textContent = t.e_item; return; }
    if (!date || date < dateEl.min) { err.textContent = t.e_date; return; }
    if (!name || !phone || !addr) { err.textContent = t.e_fill; return; }
    if (phone.replace(/\D/g, "").length < 10) { err.textContent = t.e_phone; return; }
    if (!document.getElementById("area").checked) { err.textContent = t.e_area; return; }

    try {
      localStorage.setItem("soppu_name", name);
      localStorage.setItem("soppu_phone", phone);
      localStorage.setItem("soppu_addr", addr);
    } catch(e){}

    var sep = "━━━━━━━━━━━━━━";
    var now = new Date();
    var orderNo = "SM-" + pad(now.getDate()) + pad(now.getMonth() + 1) + "-" + (100 + Math.floor(Math.random() * 900));
    var mapLink = loc ? "https://www.google.com/maps?q=" + loc.lat.toFixed(6) + "," + loc.lng.toFixed(6) : "";
    var msg = "🌿 *ಸೊಪ್ಪು ಮನೆ · Soppu Mane*\n" +
      "🧾 *ಹೊಸ ಆರ್ಡರ್ · New Order*\n" +
      t.m_orderno + ": " + orderNo + "\n" + sep + "\n" +
      "🛒 *" + t.m_items + "*\n\n" +
      lines.join("\n\n") + "\n\n" + sep + "\n" +
      "💰 *" + t.m_total + ": " + money(sum) + "*" + (on ? "\n_" + t.m_other + "_" : "") + "\n" + sep + "\n" +
      "📅 *" + t.m_date + ":*\n" + prettyDate(date) + "\n\n" +
      "👤 *" + t.m_name + ":* " + name + "\n" +
      "📞 *" + t.m_phone + ":* " + phone + "\n" +
      "🏠 *" + t.m_addr + ":*\n" + addr +
      (mapLink ? "\n\n📍 *" + t.m_loc + ":*\n" + mapLink : "") +
      (note ? "\n\n📝 *" + t.m_note + ":* " + note : "") + "\n" + sep + "\n" +
      "🙏 " + t.m_thanks;

    var s = document.getElementById("summary");
    s.style.display = "block";
    s.textContent = msg;
    document.getElementById("sentNote").style.display = "block";
    window.location.href = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(msg);
  });
</script>
